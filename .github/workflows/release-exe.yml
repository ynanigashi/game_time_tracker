name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name game_time_tracker --hidden-import PySide6.QtCharts main.py

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          New-Item -ItemType Directory -Force -Path release/config | Out-Null
          Copy-Item -Path dist/game_time_tracker/* -Destination release -Recurse -Force
          Copy-Item -Path config.ini.example -Destination release/config/config.ini.example -Force
          Copy-Item -Path README.md -Destination release/README.md -Force
          Compress-Archive -Path release/* -DestinationPath game_time_tracker-windows.zip -Force

      - name: Upload release asset
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: game_time_tracker-windows.zip

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: game_time_tracker-windows
          path: game_time_tracker-windows.zip
